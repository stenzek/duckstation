name: Translation Lint

on:
  pull_request:
    paths:
      - 'src/duckstation-qt/translations/*.ts'
      - '.github/workflows/translation-lint.yml'
  push:
    branches:
      - master
      - dev
    paths:
      - 'src/duckstation-qt/translations/*.ts'
      - '.github/workflows/translation-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-lint:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check Translation Catalogs
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          python scripts/translation/lint_ts.py --base "$BASE_SHA" --selection-base "$base" --head "$HEAD_SHA"
        elif [[ "$EVENT_NAME" == "push" ]]; then
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/translation/lint_ts.py --base "$AFTER_SHA" --all
          else
            python scripts/translation/lint_ts.py --base "$BEFORE_SHA"
          fi
        else
          python scripts/translation/lint_ts.py --base HEAD --all
        fi
