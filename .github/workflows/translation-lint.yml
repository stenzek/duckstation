name: Translation Lint

on:
  pull_request:
    paths:
      - 'src/duckstation-qt/translations/*.ts'
      - '.github/workflows/translation-lint.yml'
  push:
    branches:
      - master
      - dev
    paths:
      - 'src/duckstation-qt/translations/*.ts'
      - '.github/workflows/translation-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-lint:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        # Include the PR merge commit and its parents so HEAD^1 is available as the target-branch baseline.
        fetch-depth: 2

    - name: Check Translation Catalogs
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          # The checkout is the PR merge result, its first parent is the target branch.
          python scripts/translation/lint_ts.py --base HEAD^1
        elif [[ "$EVENT_NAME" == "push" ]]; then
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/translation/lint_ts.py --base "$AFTER_SHA" --all
          else
            # The old tip may be outside the shallow history, especially after a force push.
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            python scripts/translation/lint_ts.py --base "$BEFORE_SHA"
          fi
        else
          python scripts/translation/lint_ts.py --base HEAD --all
        fi
